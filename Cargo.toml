[workspace]
resolver = "2"
members = [
    "crates/pii-engineer-core",
    "crates/pii-engineer-server",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.78"
license = "AGPL-3.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "fs", "cors"] }
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["ndarray", "load-dynamic"] }
ndarray = "0.16"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
once_cell = "1"
regex = "1"
tokio-stream = "0.1"
hf-hub = "0.4"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
