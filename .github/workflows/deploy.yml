name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release --package pii-engineer-server

      - name: Deploy to all pool droplets
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DO_TOKEN: ${{ secrets.DO_API_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS="-o StrictHostKeyChecking=no -o IdentitiesOnly=yes -i ~/.ssh/deploy_key"

          tar czf /tmp/static.tar.gz -C static .

          # Get autoscale pool ID
          POOL_ID=$(curl -s -H "Authorization: Bearer $DO_TOKEN" \
            "https://api.digitalocean.com/v2/droplets/autoscale/pools" | \
            jq -r '.autoscale_pools[0].id')
          echo "Pool ID: $POOL_ID"

          # Get pool member IPs
          DROPLETS=$(curl -s -H "Authorization: Bearer $DO_TOKEN" \
            "https://api.digitalocean.com/v2/droplets/autoscale/pools/$POOL_ID/members" | \
            jq -r '.droplets[].networks.v4[] | select(.type=="public") | .ip_address')

          if [ -z "$DROPLETS" ]; then
            echo "No droplets found in autoscale pool"
            exit 1
          fi

          for IP in $DROPLETS; do
            echo "Deploying to $IP..."
            scp $SSH_OPTS target/release/pii-engineer-server root@$IP:/opt/pii-engineer/pii-engineer-server.new
            scp $SSH_OPTS /tmp/static.tar.gz root@$IP:/tmp/static.tar.gz
            ssh $SSH_OPTS root@$IP '
              mkdir -p /opt/pii-engineer/static
              tar xzf /tmp/static.tar.gz -C /opt/pii-engineer/static
              rm /tmp/static.tar.gz
              systemctl stop pii-engineer || true
              mv /opt/pii-engineer/pii-engineer-server.new /opt/pii-engineer/pii-engineer-server
              chmod +x /opt/pii-engineer/pii-engineer-server
              systemctl start pii-engineer
            '
            echo "Deployed to $IP ✓"
          done

      - name: Update pool snapshot
        env:
          DO_TOKEN: ${{ secrets.DO_API_TOKEN }}
        run: |
          # Get pool info
          POOL_ID=$(curl -s -H "Authorization: Bearer $DO_TOKEN" \
            "https://api.digitalocean.com/v2/droplets/autoscale/pools" | \
            jq -r '.autoscale_pools[0].id')

          # Get first member droplet ID
          DROPLET_ID=$(curl -s -H "Authorization: Bearer $DO_TOKEN" \
            "https://api.digitalocean.com/v2/droplets/autoscale/pools/$POOL_ID/members" | \
            jq -r '.droplets[0].id')

          SNAP_NAME="pii-engineer-$(date +%Y%m%d-%H%M%S)"
          echo "Taking snapshot '$SNAP_NAME' of droplet $DROPLET_ID..."

          # Take snapshot
          ACTION_ID=$(curl -s -X POST -H "Authorization: Bearer $DO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"type\":\"snapshot\",\"name\":\"$SNAP_NAME\"}" \
            "https://api.digitalocean.com/v2/droplets/$DROPLET_ID/actions" | \
            jq -r '.action.id')

          # Wait for snapshot to complete
          echo "Waiting for snapshot (action $ACTION_ID)..."
          for i in $(seq 1 60); do
            STATUS=$(curl -s -H "Authorization: Bearer $DO_TOKEN" \
              "https://api.digitalocean.com/v2/actions/$ACTION_ID" | \
              jq -r '.action.status')
            if [ "$STATUS" = "completed" ]; then
              echo "Snapshot complete"
              break
            fi
            if [ "$STATUS" = "errored" ]; then
              echo "Snapshot failed"
              exit 1
            fi
            sleep 10
          done

          # Get new snapshot ID
          SNAP_ID=$(curl -s -H "Authorization: Bearer $DO_TOKEN" \
            "https://api.digitalocean.com/v2/snapshots?resource_type=droplet" | \
            jq -r ".snapshots[] | select(.name==\"$SNAP_NAME\") | .id")

          if [ -n "$SNAP_ID" ]; then
            echo "Updating pool template with snapshot $SNAP_ID..."
            curl -s -X PUT -H "Authorization: Bearer $DO_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"template\":{\"image_id\":\"$SNAP_ID\"}}" \
              "https://api.digitalocean.com/v2/droplets/autoscale/pools/$POOL_ID"
            echo "Pool template updated ✓"
          else
            echo "Warning: could not find snapshot $SNAP_NAME"
          fi
