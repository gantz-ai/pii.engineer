name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release --package pii-engineer-server

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN }}

      - name: Deploy to all pool droplets
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS="-o StrictHostKeyChecking=no -o IdentitiesOnly=yes -i ~/.ssh/deploy_key"

          tar czf /tmp/static.tar.gz -C static .

          POOL_ID=$(doctl compute droplet-autoscale-pool list --format ID --no-header | head -1)
          DROPLETS=$(doctl compute droplet-autoscale-pool list-members $POOL_ID --format PublicIPv4 --no-header)
          if [ -z "$DROPLETS" ]; then
            echo "No droplets found in autoscale pool"
            exit 1
          fi

          for IP in $DROPLETS; do
            echo "Deploying to $IP..."
            scp $SSH_OPTS target/release/pii-engineer-server root@$IP:/opt/pii-engineer/pii-engineer-server.new
            scp $SSH_OPTS /tmp/static.tar.gz root@$IP:/tmp/static.tar.gz
            ssh $SSH_OPTS root@$IP '
              mkdir -p /opt/pii-engineer/static
              tar xzf /tmp/static.tar.gz -C /opt/pii-engineer/static
              rm /tmp/static.tar.gz
              systemctl stop pii-engineer || true
              mv /opt/pii-engineer/pii-engineer-server.new /opt/pii-engineer/pii-engineer-server
              chmod +x /opt/pii-engineer/pii-engineer-server
              systemctl start pii-engineer
            '
            echo "Deployed to $IP ✓"
          done

      - name: Update pool snapshot
        run: |
          POOL_ID=$(doctl compute droplet-autoscale-pool list --format ID --no-header | head -1)
          DROPLET_ID=$(doctl compute droplet-autoscale-pool list-members $POOL_ID --format ID --no-header | head -1)
          SNAP_NAME="pii-engineer-$(date +%Y%m%d-%H%M%S)"

          echo "Taking snapshot of droplet $DROPLET_ID..."
          doctl compute droplet-action snapshot $DROPLET_ID --snapshot-name "$SNAP_NAME" --wait

          SNAP_ID=$(doctl compute snapshot list --resource droplet --format ID,Name --no-header | grep "$SNAP_NAME" | awk '{print $1}')

          if [ -n "$SNAP_ID" ]; then
            echo "Updating pool $POOL_ID with snapshot $SNAP_ID..."
            doctl compute droplet-autoscale-pool update $POOL_ID --template-image-id $SNAP_ID
            echo "Pool template updated ✓"
          else
            echo "Warning: could not find snapshot $SNAP_NAME"
          fi
