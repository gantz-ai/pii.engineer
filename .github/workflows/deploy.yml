name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release --package pii-engineer-server

      - name: Upload binary to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create/update the "latest" release with the new binary
          gh release delete latest --yes 2>/dev/null || true
          gh release create latest target/release/pii-engineer-server \
            --title "latest" --notes "Auto-deployed from CI" --prerelease

      - name: Deploy to all pool droplets
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DO_TOKEN: ${{ secrets.DO_API_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS="-o StrictHostKeyChecking=no -o IdentitiesOnly=yes -i ~/.ssh/deploy_key"

          # Get autoscale pool ID
          POOL_ID=$(curl -s -H "Authorization: Bearer $DO_TOKEN" \
            "https://api.digitalocean.com/v2/droplets/autoscale" | \
            jq -r '.autoscale_pools[0].id')
          echo "Pool ID: $POOL_ID"

          # Get pool member droplet IDs, then resolve IPs
          MEMBER_IDS=$(curl -s -H "Authorization: Bearer $DO_TOKEN" \
            "https://api.digitalocean.com/v2/droplets/autoscale/$POOL_ID/members" | \
            jq -r '.droplets[].droplet_id')

          DROPLETS=""
          for DID in $MEMBER_IDS; do
            IP=$(curl -s -H "Authorization: Bearer $DO_TOKEN" \
              "https://api.digitalocean.com/v2/droplets/$DID" | \
              jq -r '.droplet.networks.v4[] | select(.type=="public") | .ip_address')
            DROPLETS="$DROPLETS $IP"
          done
          DROPLETS=$(echo $DROPLETS | xargs)

          if [ -z "$DROPLETS" ]; then
            echo "No droplets found in autoscale pool"
            exit 1
          fi

          for IP in $DROPLETS; do
            echo "Deploying to $IP..."
            scp $SSH_OPTS target/release/pii-engineer-server root@$IP:/opt/pii-engineer/pii-engineer-server.new
            ssh $SSH_OPTS root@$IP '
              systemctl stop pii-engineer || true
              mv /opt/pii-engineer/pii-engineer-server.new /opt/pii-engineer/pii-engineer-server
              chmod +x /opt/pii-engineer/pii-engineer-server
              systemctl start pii-engineer
            '
            echo "Deployed to $IP ✓"
          done
